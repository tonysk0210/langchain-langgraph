[project]
name = "langchain-langgraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tony Shangkuan @ Desktop", email = "tonyshangkuan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.2",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-tavily>=0.2.18",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "ruff>=0.16.10",
    "tavily>=1.1.0",
    "tavily-python>=0.8.4",
]

[project.scripts]
langchain-langgraph = "langchain_langgraph:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
